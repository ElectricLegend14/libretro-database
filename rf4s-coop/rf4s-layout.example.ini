# rf4s-layout.ini: try signatures and offsets without rebuilding the DLL.
# Copy this file to rf4s-layout.ini next to rf4s-coop.dll and fill in what you
# have found. Anything left out keeps the value compiled into the DLL.
# Numbers can be decimal or 0x-hex.

# The instruction that loads the player pointer, e.g. mov rax, [rip+disp32].
# disp_offset: where the 4-byte displacement starts within the matched bytes.
# instr_length: from the start of the match to the end of that instruction.
# player.signature = 48 8B 05 ?? ?? ?? ?? 48 85 C0 74 ??
# player.disp_offset = 3
# player.instr_length = 7

# Offsets inside the player object.
# player.pos = 0x10
# player.hp = 0x24
# player.max_hp = 0x28

# map.signature = 0F B7 05 ?? ?? ?? ??
# map.disp_offset = 3
# map.instr_length = 7

# clock.signature = 48 8B 0D ?? ?? ?? ??
# clock.minute = 0x5

# Logs the first N bytes of the player object every 2 seconds. Take damage or
# walk between dumps and compare them to spot where values live.
# dump_player_bytes = 256

# The game's per-frame update function. When found, co-op runs inside it, on
# the game's own thread, which is required before the mod writes game memory.
# Without it, co-op runs on a thread beside the game (fine for reading only).
# offset: from the start of the match to the start of the function.
# frame.signature = 48 89 5C 24 08 57 48 83 EC 20 48 8B D9
# frame.offset = 0
