; Where the co-op mod finds the game's functions.
; Copy to sdmc:/config/fe3h-coop/offsets.ini next to coop.ini.
;
; Leave a hook blank until you've found it. Blank hooks are skipped, and the
; mod still runs the controller relay (ZL + ZR + Plus passes the turn).
;
; Each hook takes one of:
;   0x7A1B40                 offset into the main module, as Ghidra shows it
;                            after you rebase the image to 0
;   pattern: FD 7B BF A9 ..  bytes at the start of the function (?? = any byte)
;   call: ?? ?? ?? ?? E0 ..  bytes starting at a BL that calls the function
;                            (the first 4 bytes always match any BL)
;
; Patterns keep working after game updates; raw offsets usually don't.
; See docs/REVERSING.md for how to find each one.

[hooks]
unit_character_id =
can_select_unit =
begin_player_phase =
end_player_phase =
prep_unit_list_input =
draw_map_cursor =
draw_unit_outline =

; If the game has no separate function that returns a unit's character id,
; set where the id sits inside a unit's data instead of unit_character_id.
[units]
character_id_field =
character_id_size = 2
