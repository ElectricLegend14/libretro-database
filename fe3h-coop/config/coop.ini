; Fire Emblem: Three Houses co-op settings
; Copy to sdmc:/config/fe3h-coop/coop.ini (or the emulator's SD folder).
; Lines starting with ; are comments.

[coop]
; 2 to 4 players
players = 2
; Who can move units nobody claimed: shared (anyone), host (player 1), locked (no one)
unclaimed_units = shared
; Press ZR on a unit in the battle prep screen to claim or release it.
; Claims you make in-game are saved back to this file.
in_game_claiming = true
; Draw each unit's outline in its owner's color
tint_unit_outlines = true

; Each player section:
;   name       - shown on the "<name>'s turn" banner
;   color      - #RRGGBB, or a preset: blue red green yellow purple orange
;                pink cyan white, or the house colors eagle lion deer
;   controller - 1-8. Two players can share one controller for hot-seat play.
;   characters - comma-separated names, or #<id> for a raw game character id

[player1]
name = Player 1
color = blue
controller = 1
characters = Byleth, Edelgard, Hubert, Dorothea

[player2]
name = Player 2
color = red
controller = 2
characters = Petra, Caspar, Bernadetta, Linhardt
